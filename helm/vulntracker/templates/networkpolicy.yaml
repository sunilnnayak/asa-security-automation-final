apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vulntracker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vulntracker
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.database.cidr }}
    - to:
        - ipBlock:
            cidr: {{ .Values.database.cidr | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.database.port }}
    {{- end }}
